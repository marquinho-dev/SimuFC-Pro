<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Configurações do Contator</title>
<script src="./vendor/react.js"></script>
<script src="./vendor/react-dom.js"></script>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@500;700&amp;display=swap">
<style>body{margin:0}button{font-family:inherit;cursor:pointer}</style>
</helmet>
<div style="width:1000px;height:640px;box-sizing:border-box;background:#0a0f16;display:flex;align-items:center;justify-content:center;font-family:Inter,system-ui,sans-serif;color:#e6edf5">
<div style="width:920px;height:560px;display:flex;background:#121b27;border:1px solid #2a3a4f;border-radius:16px;box-shadow:0 24px 60px rgba(0,0,0,.55);overflow:hidden">

<aside style="width:300px;flex:none;background:#0d1520;border-right:1px solid #243246;padding:24px;display:flex;flex-direction:column;gap:20px;box-sizing:border-box;justify-content:flex-start">
<div>
<div style="font-size:12px;color:#8fa3b8;letter-spacing:.06em;text-transform:uppercase;font-weight:600">Componente</div>
<div style="font-family:'JetBrains Mono',monospace;font-size:26px;font-weight:700;color:#5cc8ff;margin-top:4px">KM1</div>
<div style="font-size:13px;color:#a9bbcf">Contator de potência</div>
</div>
<svg viewBox="0 0 252 190" width="252" height="190" role="img" aria-label="Esquema do contator com terminais">
<rect x="16" y="36" width="220" height="118" rx="10" fill="#172230" stroke="#2f4560" stroke-width="1.5"></rect>
<g fill="#5cc8ff" font-size="11" font-family="JetBrains Mono,monospace" text-anchor="middle" font-weight="700">
<circle cx="66" cy="36" r="5"></circle><circle cx="126" cy="36" r="5"></circle><circle cx="186" cy="36" r="5"></circle>
<text x="66" y="22">1/L1</text><text x="126" y="22">3/L2</text><text x="186" y="22">5/L3</text>
<circle cx="66" cy="154" r="5"></circle><circle cx="126" cy="154" r="5"></circle><circle cx="186" cy="154" r="5"></circle>
<text x="66" y="177">2/T1</text><text x="126" y="177">4/T2</text><text x="186" y="177">6/T3</text>
</g>
<rect x="36" y="64" width="80" height="26" rx="6" fill="#0f2e22" stroke="#1f6b48"></rect>
<text x="76" y="82" text-anchor="middle" fill="#5fe39a" font-size="12" font-weight="700" font-family="JetBrains Mono,monospace">53-54 NA</text>
<rect x="136" y="64" width="80" height="26" rx="6" fill="#34171a" stroke="#7a2f35"></rect>
<text x="176" y="82" text-anchor="middle" fill="#ff8a8a" font-size="12" font-weight="700" font-family="JetBrains Mono,monospace">61-62 NF</text>
<text x="126" y="122" text-anchor="middle" fill="#f5b942" font-size="12" font-weight="700" font-family="JetBrains Mono,monospace">A1–A2 · 220V AC</text>
</svg>
</aside>

<div style="flex:1;display:flex;flex-direction:column;min-width:0">
<div style="display:flex;align-items:center;padding:20px 24px;border-bottom:1px solid #243246">
<div style="flex:1;font-size:17px;font-weight:700;color:#f2f6fb">Configurações</div>
<button type="button" aria-label="Fechar" style="width:44px;height:44px;border-radius:10px;border:0;background:transparent;color:#9fb0c3;display:flex;align-items:center;justify-content:center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></button>
</div>

<div style="flex:1;padding:24px;display:flex;flex-direction:column;gap:22px">

<section style="display:flex;flex-direction:column;gap:10px">
<div style="font-size:13px;font-weight:600;color:#c9d6e4">Polos de potência</div>
<div style="display:flex;padding:4px;gap:4px;background:#0d1520;border:1px solid #243246;border-radius:12px">
<button type="button" aria-pressed="true" style="flex:1;height:52px;border-radius:9px;border:0;background:#1d4f75;color:#fff;font-weight:700;font-size:14px">Tripolar · 3P<div style="font-size:11px;font-weight:500;color:#bfe3fa;font-family:'JetBrains Mono',monospace">L1 L2 L3</div></button>
<button type="button" aria-pressed="false" style="flex:1;height:52px;border-radius:9px;border:0;background:transparent;color:#a9bbcf;font-weight:700;font-size:14px">Tetrapolar · 4P<div style="font-size:11px;font-weight:500;font-family:'JetBrains Mono',monospace">L1 L2 L3 L4</div></button>
</div>
</section>

<section style="display:flex;flex-direction:column;gap:10px">
<div style="font-size:13px;font-weight:600;color:#c9d6e4">Tensão da bobina <span style="color:#8fa3b8;font-weight:500;font-family:'JetBrains Mono',monospace">A1–A2</span></div>
<div style="display:flex;gap:8px;flex-wrap:wrap">
<button type="button" aria-pressed="true" style="height:44px;padding:0 16px;border-radius:10px;border:1.5px solid #f5b942;background:#33280f;color:#f5b942;font-family:'JetBrains Mono',monospace;font-weight:700;font-size:13px">220V AC</button>
<button type="button" aria-pressed="false" style="height:44px;padding:0 16px;border-radius:10px;border:1.5px solid #2a3a4f;background:#172230;color:#c9d6e4;font-family:'JetBrains Mono',monospace;font-weight:700;font-size:13px">24V DC</button>
<button type="button" aria-pressed="false" style="height:44px;padding:0 16px;border-radius:10px;border:1.5px solid #2a3a4f;background:#172230;color:#c9d6e4;font-family:'JetBrains Mono',monospace;font-weight:700;font-size:13px">24V AC</button>
<button type="button" aria-pressed="false" style="height:44px;padding:0 16px;border-radius:10px;border:1.5px solid #2a3a4f;background:#172230;color:#c9d6e4;font-family:'JetBrains Mono',monospace;font-weight:700;font-size:13px">110V AC</button>
<button type="button" aria-pressed="false" style="height:44px;padding:0 16px;border-radius:10px;border:1.5px solid #2a3a4f;background:#172230;color:#c9d6e4;font-family:'JetBrains Mono',monospace;font-weight:700;font-size:13px">380V AC</button>
</div>
</section>

<section style="display:flex;flex-direction:column;gap:10px">
<div style="font-size:13px;font-weight:600;color:#c9d6e4">Bloco de contatos auxiliares frontais <span style="color:#8fa3b8;font-weight:500">(aditivo)</span></div>
<div style="display:flex;padding:4px;gap:4px;background:#0d1520;border:1px solid #243246;border-radius:12px">
<button type="button" aria-pressed="false" style="flex:1;height:44px;border-radius:9px;border:0;background:transparent;color:#a9bbcf;font-weight:700;font-size:13px">Nenhum</button><button type="button" aria-pressed="true" style="flex:1;height:44px;border-radius:9px;border:0;background:#1d4f75;color:#fff;font-weight:700;font-size:13px">1 NA + 1 NF</button><button type="button" aria-pressed="false" style="flex:1;height:44px;border-radius:9px;border:0;background:transparent;color:#a9bbcf;font-weight:700;font-size:13px">2 NA</button><button type="button" aria-pressed="false" style="flex:1;height:44px;border-radius:9px;border:0;background:transparent;color:#a9bbcf;font-weight:700;font-size:13px">2 NF</button><button type="button" aria-pressed="false" style="flex:1;height:44px;border-radius:9px;border:0;background:transparent;color:#a9bbcf;font-weight:700;font-size:13px">2 NA + 2 NF</button>
</div>
<div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:12px;color:#a9bbcf">
<span>Bloco frontal de 2 polos:</span>
<span style="font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:700;color:#5fe39a;background:#0f2e22;border:1px solid #1f6b48;border-radius:6px;padding:3px 8px">53-54 (NA)</span>
<span style="font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:700;color:#ff8a8a;background:#34171a;border:1px solid #7a2f35;border-radius:6px;padding:3px 8px">61-62 (NF)</span>
</div>
</section>

</div>

<div style="display:flex;justify-content:flex-end;gap:12px;padding:16px 24px;border-top:1px solid #243246">
<button type="button" style="height:44px;padding:0 22px;border-radius:10px;border:1px solid #2a3a4f;background:transparent;color:#c9d6e4;font-weight:600;font-size:14px">Cancelar</button>
<button type="button" style="height:44px;padding:0 24px;border-radius:10px;border:0;background:#2f9be0;color:#04121f;font-weight:700;font-size:14px">Salvar configurações</button>
</div>
</div>

</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1000,"height":640}}'>
class Component extends DCLogic {
renderVals() { return {}; }
}
</script>
</body>
</html>
